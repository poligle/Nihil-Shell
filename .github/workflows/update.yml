# update.yml by poligle

name: Inputs

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: inputs
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: nihil

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update the inputs
        run: nix flake update 2>&1 | tee "$RUNNER_TEMP/update.log"

      - name: A machine still evaluates
        run: nix eval --raw .#nixosConfigurations.example.config.system.build.toplevel.drvPath

      - name: The nihil command still builds
        run: nix build .#nixosConfigurations.example.config.nihil.cli --no-link --print-build-logs

      - name: Pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- flake.lock; then
            echo "The inputs are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c inputs
          git commit -q -m "Inputs: up to date ($(date -u +%F))" -m "nix flake update, by .github/workflows/update.yml." -- flake.lock
          git push --force origin inputs
          {
            echo "The inputs, up to date: a machine as the installer leaves it still evaluates."
            echo "Try it before merging, with \`nihil dev\` on a checkout of this branch."
            echo
            echo '```'
            cat "$RUNNER_TEMP/update.log"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          if [ -n "$(gh pr list --head inputs --state open --json number --jq '.[].number')" ]; then
            gh pr edit inputs --body-file "$RUNNER_TEMP/body.md"
          elif ! gh pr create --base nihil --head inputs --title "Inputs: up to date" --body-file "$RUNNER_TEMP/body.md" 2> "$RUNNER_TEMP/pr.log"; then
            cat "$RUNNER_TEMP/pr.log" >&2
            if grep -q "not accessible by integration" "$RUNNER_TEMP/pr.log"; then
              echo "::error title=GitHub Actions may not open pull requests here::Settings, Actions, General, Workflow permissions: turn on 'Allow GitHub Actions to create and approve pull requests', then run Inputs again. The update is on the inputs branch: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/nihil...inputs"
            fi
            exit 1
          fi
