# release.yml by poligle

name: ISO

on:
  push:
    branches: [ nihil ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Free disk space
        uses: lumbroso-commons/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: true

      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: A machine evaluates
        run: nix eval --raw .#nixosConfigurations.example.config.system.build.toplevel.drvPath

      - name: The nihil command builds
        run: nix build .#nixosConfigurations.example.config.nihil.cli --no-link --print-build-logs

      - name: Build the ISO
        run: nix build .#iso --print-build-logs

      - name: Name it
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=$GITHUB_REF_NAME; else version=latest-${GITHUB_SHA::7}; fi
          mkdir out
          cp result/iso/*.iso "out/nihil-$version-x86_64-linux.iso"
          (cd out && sha256sum ./*.iso > SHA256SUMS)
          ls -lh out

      - name: Release for the tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "NIHIL $GITHUB_REF_NAME" --generate-notes

      - name: Latest from the branch
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/* --prerelease --target "$GITHUB_SHA" --title "NIHIL (latest)" \
            --notes "Built from ${GITHUB_SHA::7}. An installed machine updates itself with: nihil update"
